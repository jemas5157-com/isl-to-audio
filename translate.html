<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISL.AI.com — Live AI Translator</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #09090b 0%, #064e3b 50%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.16);
      --accent-purple: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      --accent-green: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-top: 68px;
      padding-bottom: 40px;
      overflow-x: hidden;
    }

    /* Compact Fixed Top Navigation Bar */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 1000;
    }

    .brand {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    .nav-btn {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9px;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: var(--accent-purple);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(139, 92, 246, 0.4);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .status-pill {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #6ee7b7;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #030712;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      margin-bottom: 14px;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    /* Mirror front camera naturally */
    .mirrored {
      transform: scaleX(-1);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    button, select {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      box-shadow: 0 4px 16px rgba(109, 40, 217, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
    }

    select {
      background: #0f172a;
      color: #f8fafc;
      grid-column: span 2;
    }

    /* Audio Control Bar: Mute Toggle + Volume Slider */
    .audio-controls {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mute-btn {
      width: auto;
      min-width: 96px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--accent-green);
      color: #fff;
      border: none;
      font-size: 0.82rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .mute-btn.muted {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    }

    .slider-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .volume-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #8b5cf6;
      cursor: pointer;
    }

    .output-box {
      text-align: center;
      padding: 18px;
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.35), rgba(30, 27, 75, 0.35));
    }

    .output-label {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .recognized-text {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <!-- Sleek Fixed Top Bar -->
  <nav class="top-nav">
    <div class="brand">ISL.AI.com</div>
    <div class="nav-buttons">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="translate.html" class="nav-btn active">Live AI Translator</a>
    </div>
  </nav>

  <main class="container">
    <section class="glass-card">
      <div class="status-pill" id="statusText">Camera Ready • Two-Hand 0.89s Engine</div>
      <h2 style="font-size: 1.2rem; margin-bottom: 12px;">🎙️ Live ISL to Audio Engine</h2>

      <div class="video-box">
        <video id="inputVideo" class="mirrored" playsinline muted></video>
        <canvas id="outputCanvas" class="mirrored"></canvas>
      </div>

      <div class="controls">
        <button class="btn-primary" id="startBtn">▶ Start Camera</button>
        <button class="btn-secondary" id="flipBtn">🔄 Switch Camera</button>
        <select id="langSelect">
          <option value="en-IN">English (India)</option>
          <option value="hi-IN">Hindi (हिन्दी)</option>
          <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
        </select>
      </div>

      <!-- Mute Toggle + Volume Slider Bar -->
      <div class="audio-controls">
        <button type="button" class="mute-btn" id="muteBtn">🔊 Sound On</button>
        <div class="slider-wrap">
          <div class="volume-header">
            <span>TTS Audio Volume</span>
            <span id="volumeValue">100%</span>
          </div>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </section>

    <section class="glass-card output-box">
      <div class="output-label">Recognized Sign</div>
      <div class="recognized-text" id="signOutput">Waiting for hand sign...</div>
    </section>
  </main>

  <script>
    const videoEl = document.getElementById('inputVideo');
    const canvasEl = document.getElementById('outputCanvas');
    const canvasCtx = canvasEl.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const flipBtn = document.getElementById('flipBtn');
    const langSelect = document.getElementById('langSelect');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const signOutput = document.getElementById('signOutput');
    const statusText = document.getElementById('statusText');

    let facingMode = 'user';
    let currentStream = null;
    let isRunning = false;
    let isMuted = false;

    let candidateSign = '';
    let holdStartTime = 0;
    let lastSpokenSign = '';
    const TRIGGER_DELAY_MS = 890;

    let availableVoices = [];
    function loadVoices() {
      availableVoices = window.speechSynthesis.getVoices();
    }
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        window.speechSynthesis.cancel();
        muteBtn.textContent = '🔇 Muted';
        muteBtn.classList.add('muted');
      } else {
        muteBtn.textContent = '🔊 Sound On';
        muteBtn.classList.remove('muted');
      }
    });

    volumeSlider.addEventListener('input', () => {
      const vol = parseFloat(volumeSlider.value);
      volumeValue.textContent = Math.round(vol * 100) + '%';
      if (vol === 0 && !isMuted) {
        isMuted = true;
        muteBtn.textContent = '🔇 Muted';
        muteBtn.classList.add('muted');
      } else if (vol > 0 && isMuted) {
        isMuted = false;
        muteBtn.textContent = '🔊 Sound On';
        muteBtn.classList.remove('muted');
      }
    });

    const welcomeMessages = {
      'en-IN': 'Welcome to our ISL to audio web. It is purely designed to help speech impaired people.',
      'hi-IN': 'हमारे पेज पर आपका स्वागत है। जिन लोगों के पास बोलने की क्षमता नहीं होती, उनके लिए यह पेज डिज़ाइन किया गया है।',
      'pa-IN': 'ਸਾਡੇ ਆਈ ਐਸ ਐਲ ਟੂ ਆਡੀਓ ਵੈੱਬ ਪੇਜ ਤੇ ਤੁਹਾਡਾ ਸਵਾਗਤ ਹੈ।'
    };

    // 15 Specific Gestures with multi-language translations
    const translations = {
      'HELLO': { 'en-IN': 'Hello', 'hi-IN': 'नमस्ते', 'pa-IN': 'ਸਤ ਸ੍ਰੀ ਅਕਾਲ' },
      'I LOVE YOU': { 'en-IN': 'I love you', 'hi-IN': 'मैं तुमसे प्यार करता हूँ', 'pa-IN': 'ਮੈਂ ਤੁਹਾਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ' },
      'THANK YOU': { 'en-IN': 'Thank you', 'hi-IN': 'धन्यवाद', 'pa-IN': 'ਧੰਨਵਾਦ' },
      'YES': { 'en-IN': 'Yes', 'hi-IN': 'हाँ', 'pa-IN': 'ਹਾਂ' },
      'NO': { 'en-IN': 'No', 'hi-IN': 'नहीं', 'pa-IN': 'ਨਹੀਂ' },
      'HELP': { 'en-IN': 'Please help me', 'hi-IN': 'कृपया मेरी मदद करें', 'pa-IN': 'ਕਿਰਪਾ ਕਰਕੇ ਮੇਰੀ ਮਦਦ ਕਰੋ' },
      'GOOD': { 'en-IN': 'Good', 'hi-IN': 'अच्छा', 'pa-IN': 'ਵਧੀਆ' },
      'BAD': { 'en-IN': 'Bad', 'hi-IN': 'बुरा', 'pa-IN': 'ਮਾੜਾ' },
      'PLEASE': { 'en-IN': 'Please', 'hi-IN': 'कृपया', 'pa-IN': 'ਕਿਰਪਾ ਕਰਕੇ' },
      'SORRY': { 'en-IN': 'Sorry', 'hi-IN': 'क्षमा करें', 'pa-IN': 'ਮਾਫ਼ ਕਰੋ' },
      'STOP': { 'en-IN': 'Stop', 'hi-IN': 'रुको', 'pa-IN': 'ਰੁਕੋ' },
      'MORE': { 'en-IN': 'More', 'hi-IN': 'और', 'pa-IN': 'ਹੋਰ' },
      'FRIEND': { 'en-IN': 'Friend', 'hi-IN': 'मित्र', 'pa-IN': 'ਦੋਸਤ' },
      'WATER': { 'en-IN': 'Water', 'hi-IN': 'पानी', 'pa-IN': 'ਪਾਣੀ' },
      'NAMASTE': { 'en-IN': 'Namaste everyone', 'hi-IN': 'सभी को नमस्कार', 'pa-IN': 'ਸਾਰਿਆਂ ਨੂੰ ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ' }
    };

    function speakRaw(text, lang) {
      if (isMuted) return;
      const vol = parseFloat(volumeSlider.value);
      if (vol <= 0) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.volume = vol;
      utterance.rate = 1.0;

      if (availableVoices.length > 0) {
        let match = availableVoices.find(v => v.lang === lang);
        if (!match && lang === 'pa-IN') {
          match = availableVoices.find(v => v.lang.startsWith('hi'));
        }
        if (!match) {
          match = availableVoices.find(v => v.lang.startsWith(lang.split('-')[0]));
        }
        if (match) utterance.voice = match;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSign(key) {
      const lang = langSelect.value;
      const text = (translations[key] && translations[key][lang]) || key;
      signOutput.textContent = text;
      speakRaw(text, lang);
    }

    function detectSingleHandGesture(landmarks) {
      const indexOpen = landmarks[8].y < landmarks[6].y;
      const middleOpen = landmarks[12].y < landmarks[10].y;
      const ringOpen = landmarks[16].y < landmarks[14].y;
      const pinkyOpen = landmarks[20].y < landmarks[18].y;

      const thumbTipDist = Math.hypot(landmarks[4].x - landmarks[17].x, landmarks[4].y - landmarks[17].y);
      const thumbBaseDist = Math.hypot(landmarks[3].x - landmarks[17].x, landmarks[3].y - landmarks[17].y);
      const thumbOpen = thumbTipDist > thumbBaseDist * 1.15;

      // 15 distinct gesture mappings based on finger states
      if (thumbOpen && indexOpen && !middleOpen && !ringOpen && pinkyOpen) return 'I LOVE YOU';
      if (indexOpen && middleOpen && ringOpen && pinkyOpen && thumbOpen) return 'HELLO';
      if (indexOpen && middleOpen && ringOpen && pinkyOpen && !thumbOpen) return 'STOP';
      if (!thumbOpen && !indexOpen && !middleOpen && !ringOpen && !pinkyOpen) return 'YES';
      if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen && !thumbOpen) return 'NO';
      if (indexOpen && middleOpen && ringOpen && !pinkyOpen && !thumbOpen) return 'HELP';
      if (thumbOpen && !indexOpen && !middleOpen && !ringOpen && !pinkyOpen) return 'GOOD';
      if (!thumbOpen && !indexOpen && !middleOpen && !ringOpen && pinkyOpen) return 'BAD';
      if (thumbOpen && indexOpen && middleOpen && !ringOpen && !pinkyOpen) return 'PLEASE';
      if (!thumbOpen && !indexOpen && middleOpen && ringOpen && pinkyOpen) return 'SORRY';
      if (thumbOpen && !indexOpen && !middleOpen && !ringOpen && pinkyOpen) return 'MORE';
      if (!thumbOpen && indexOpen && !middleOpen && ringOpen && !pinkyOpen) return 'FRIEND';
      if (!thumbOpen && !indexOpen && middleOpen && !ringOpen && !pinkyOpen) return 'WATER';
      if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) return 'THANK YOU';

      return '';
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults((results) => {
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      const multiLandmarks = results.multiHandLandmarks || [];

      if (multiLandmarks.length > 0) {
        for (let i = 0; i < multiLandmarks.length; i++) {
          const lm = multiLandmarks[i];
          const color = i === 0 ? '#34d399' : '#a78bfa';
          drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, { color, lineWidth: 3 });
          drawLandmarks(canvasCtx, lm, { color: '#ffffff', lineWidth: 1, radius: 3 });
        }

        let detected = '';
        if (multiLandmarks.length === 2) {
          detected = 'NAMASTE';
        } else {
          detected = detectSingleHandGesture(multiLandmarks[0]);
        }

        if (detected) {
          if (detected !== candidateSign) {
            candidateSign = detected;
            holdStartTime = performance.now();
          } else if (performance.now() - holdStartTime >= TRIGGER_DELAY_MS && detected !== lastSpokenSign) {
            lastSpokenSign = detected;
            speakSign(detected);
          }
        }
      } else {
        candidateSign = '';
        lastSpokenSign = '';
      }
      canvasCtx.restore();
    });

    async function startCamera() {
      const lang = langSelect.value;
      const welcomeText = welcomeMessages[lang] || welcomeMessages['en-IN'];
      speakRaw(welcomeText, lang);

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
      });

      if (facingMode === 'user') {
        videoEl.classList.add('mirrored');
        canvasEl.classList.add('mirrored');
      } else {
        videoEl.classList.remove('mirrored');
        canvasEl.classList.remove('mirrored');
      }

      videoEl.srcObject = currentStream;
      await videoEl.play();
      isRunning = true;
      statusText.textContent = 'Tracking Active • 15-Gesture Mode';

      async function frameLoop() {
        if (!isRunning) return;
        if (videoEl.readyState >= 2) {
          await hands.send({ image: videoEl });
        }
        requestAnimationFrame(frameLoop);
      }
      frameLoop();
    }

    startBtn.addEventListener('click', startCamera);

    flipBtn.addEventListener('click', () => {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      if (isRunning) startCamera();
    });

    langSelect.addEventListener('change', () => {
      lastSpokenSign = '';
      const lang = langSelect.value;
      const welcomeText = welcomeMessages[lang] || welcomeMessages['en-IN'];
      speakRaw(welcomeText, lang);
    });
  </script>
</body>
</html>
