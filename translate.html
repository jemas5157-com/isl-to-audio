<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ISL Translator — Live Camera</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #000000;
            --card: rgba(22, 22, 25, 0.82);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #0a84ff;
            --accent-glow: rgba(10, 132, 255, 0.4);
            --green: #30d158;
            --text: #f5f5f7;
            --muted: #86868b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 14px 36px;
        }

        header {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(10, 132, 255, 0.15);
            border: 1px solid rgba(10, 132, 255, 0.3);
            color: var(--accent);
        }

        .camera-card {
            position: relative;
            width: 100%;
            max-width: 430px;
            aspect-ratio: 3/4;
            background: #111;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        video, canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .hud-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .status-pill {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff453a; }
        .status-dot.live { background: var(--green); box-shadow: 0 0 10px var(--green); }

        .controls-bar {
            width: 100%;
            max-width: 430px;
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 16px;
            cursor: pointer;
            transition: transform 0.15s ease;
            flex: 1;
        }

        button:active { transform: scale(0.97); }

        #startBtn {
            flex: 2;
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        #muteBtn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .result-card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-top: 14px;
            text-align: center;
        }

        .label-small {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        #translationText {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            min-height: 36px;
        }

        .hold-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            margin-top: 12px;
            overflow: hidden;
        }

        #holdBarFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0a84ff, #30d158);
            transition: width 0.05s linear;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← Home</a>
        <div class="badge"> 1.11s Engine</div>
    </header>

    <div class="camera-card">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div class="hud-overlay">
            <div class="status-pill">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusLabel">Camera Off</span>
            </div>
            <div class="status-pill" id="fpsBadge">0 FPS</div>
        </div>
    </div>

    <div class="controls-bar">
        <button id="startBtn">Start Camera</button>
        <button id="muteBtn">🔊 Voice On</button>
    </div>

    <div class="result-card">
        <div class="label-small">Active Translation</div>
        <div id="translationText">Ready</div>
        <div class="hold-bar-bg">
            <div id="holdBarFill"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');
        const translationText = document.getElementById('translationText');
        const holdBarFill = document.getElementById('holdBarFill');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const fpsBadge = document.getElementById('fpsBadge');

        let isRunning = false;
        let isMuted = false;
        let currentCandidate = "";
        let candidateStartTime = 0;
        // Exactly 0.89 seconds hold delay (0890 milliseconds)
        const REQUIRED_HOLD_MS = 0890; 
        let lastSpoken = "";
        let lastFrameTime = performance.now();

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteBtn.innerText = isMuted ? "🔇 Muted" : "🔊 Voice On";
            if (isMuted) window.speechSynthesis.cancel();
        });

        function speak(text) {
            if (isMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-IN';
            msg.rate = 1.0;
            window.speechSynthesis.speak(msg);
        }

        function dist3D(p1, p2) {
            return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z - p2.z) * 1.5);
        }

        function analyzeHand3D(lm, handedness) {
            const wrist = lm[0];
            const indexMcp = lm[5];
            const middleMcp = lm[9];
            const pinkyMcp = lm[17];

            const isSeedha = wrist.y > middleMcp.y + 0.03;
            const isUlta = middleMcp.y > wrist.y + 0.03;

            const tipToWrist = (p) => dist3D(p, wrist);
            const mcpToWrist = (p) => dist3D(p, wrist);

            const thumbOpen = dist3D(lm[4], pinkyMcp) > dist3D(lm[3], pinkyMcp) * 1.1;
            const indexOpen = tipToWrist(lm[8]) > mcpToWrist(lm[6]) * 1.15;
            const middleOpen = tipToWrist(lm[12]) > mcpToWrist(lm[10]) * 1.15;
            const ringOpen = tipToWrist(lm[16]) > mcpToWrist(lm[14]) * 1.15;
            const pinkyOpen = tipToWrist(lm[20]) > mcpToWrist(lm[18]) * 1.15;

            return { isSeedha, thumbOpen, indexOpen, middleOpen, ringOpen, pinkyOpen, wrist, indexTip: lm[8], thumbTip: lm[4] };
        }

        function classifyGesture(handsList) {
            if (handsList.length === 0) return "";
            if (handsList.length === 2) {
                const h1 = handsList[0], h2 = handsList[1];
                const wristDist = dist3D(h1.wrist, h2.wrist);
                const indexTipDist = dist3D(h1.indexTip, h2.indexTip);
                if (wristDist < 0.38 && indexTipDist < 0.20) return "Namaste";
                if (indexTipDist < 0.15 && wristDist > 0.15) return "I Love You";
            }
            const h = handsList[0];
            if (h.isSeedha && h.thumbOpen && h.indexOpen && h.middleOpen && h.ringOpen && h.pinkyOpen) return "Hello";
            if (!h.thumbOpen && !h.indexOpen && !h.middleOpen && !h.ringOpen && !h.pinkyOpen) return "Help Me";
            if (h.thumbOpen && !h.indexOpen && !h.middleOpen && !h.ringOpen && !h.pinkyOpen && h.thumbTip.y < h.wrist.y - 0.05) return "Yes, Good";
            if (h.isSeedha && h.indexOpen && h.middleOpen && !h.ringOpen && !h.pinkyOpen) return "Thank You";
            if (h.indexOpen && !h.middleOpen && !h.ringOpen) return "One";
            if (h.indexOpen && h.middleOpen && !h.ringOpen) return "Two";
            return "";
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

        hands.onResults((results) => {
            const now = performance.now();
            const fps = Math.round(1000 / Math.max(1, now - lastFrameTime));
            lastFrameTime = now;
            fpsBadge.innerText = `${fps} FPS`;

            if (video.videoWidth && canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const analyzedHands = [];
                results.multiHandLandmarks.forEach((lm, idx) => {
                    const rawHand = results.multiHandedness?.[idx]?.label || 'Right';
                    const trueHand = rawHand === 'Left' ? 'Right' : 'Left';
                    const lineColor = idx === 0 ? '#0a84ff' : '#af52de';
                    drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: lineColor, lineWidth: 3 });
                    analyzedHands.push(analyzeHand3D(lm, trueHand));
                });

                const detectedSign = classifyGesture(analyzedHands);
                const currentTime = performance.now();

                // Floating label right above hand
                if (detectedSign && results.multiHandLandmarks[0]) {
                    const handLm = results.multiHandLandmarks[0];
                    const wristX = handLm[0].x * canvas.width;
                    const wristY = handLm[0].y * canvas.height;

                    ctx.save();
                    ctx.font = 'bold 18px -apple-system, sans-serif';
                    ctx.textAlign = 'center';
                    const textWidth = ctx.measureText(detectedSign).width;
                    ctx.fillStyle = 'rgba(22, 22, 25, 0.88)';
                    ctx.beginPath();
                    ctx.roundRect(wristX - textWidth / 2 - 12, wristY - 55, textWidth + 24, 32, 8);
                    ctx.fill();
                    ctx.strokeStyle = '#0a84ff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.fillStyle = '#0a84ff';
                    ctx.fillText(detectedSign, wristX, wristY - 33);
                    ctx.restore();
                }

                if (detectedSign) {
                    if (detectedSign === currentCandidate) {
                        const elapsed = currentTime - candidateStartTime;
                        const pct = Math.min(100, Math.round((elapsed / REQUIRED_HOLD_MS) * 100));
                        holdBarFill.style.width = pct + "%";

                        if (elapsed >= REQUIRED_HOLD_MS) {
                            translationText.innerText = detectedSign;
                            if (lastSpoken !== detectedSign) {
                                speak(detectedSign);
                                lastSpoken = detectedSign;
                            }
                        }
                    } else {
                        currentCandidate = detectedSign;
                        candidateStartTime = currentTime;
                        holdBarFill.style.width = "0%";
                    }
                } else {
                    currentCandidate = "";
                    candidateStartTime = 0;
                    holdBarFill.style.width = "0%";
                }
            } else {
                currentCandidate = "";
                candidateStartTime = 0;
                holdBarFill.style.width = "0%";
                translationText.innerText = "Show Hand";
            }
            ctx.restore();
        });

        async function processLoop() {
            if (!isRunning) return;
            if (video.readyState >= 2) await hands.send({ image: video });
            requestAnimationFrame(processLoop);
        }

        startBtn.addEventListener('click', async () => {
            if (isRunning) return;
            speak("System online");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                isRunning = true;
                statusDot.classList.add('live');
                statusLabel.innerText = "Live AI";
                startBtn.innerText = "Running...";
                startBtn.style.opacity = "0.7";
                processLoop();
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        });
    </script>
</body>
</html>
