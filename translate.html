<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ISL Translator — 40 Gestures Live Camera</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #000000;
            --card: rgba(22, 22, 25, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #0a84ff;
            --accent-glow: rgba(10, 132, 255, 0.4);
            --green: #30d158;
            --text: #f5f5f7;
            --muted: #86868b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 14px 36px;
        }

        header {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(10, 132, 255, 0.15);
            border: 1px solid rgba(10, 132, 255, 0.3);
            color: var(--accent);
        }

        .camera-card {
            position: relative;
            width: 100%;
            max-width: 430px;
            aspect-ratio: 3/4;
            background: #111;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        video { display: none; }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hud-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .status-pill {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff453a; }
        .status-dot.live { background: var(--green); box-shadow: 0 0 10px var(--green); }

        .controls-bar {
            width: 100%;
            max-width: 430px;
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 16px;
            cursor: pointer;
            transition: transform 0.15s ease;
            width: 100%;
        }

        button:active { transform: scale(0.97); }

        #startBtn {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .result-card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-top: 14px;
            text-align: center;
        }

        .label-small {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        #translationText {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            min-height: 36px;
        }

        .hold-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            margin-top: 12px;
            overflow: hidden;
        }

        #holdBarFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0a84ff, #30d158);
            transition: width 0.05s linear;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← Home</a>
        <div class="badge" id="langBadge"> EN • 40 Signs</div>
    </header>

    <div class="camera-card">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div class="hud-overlay">
            <div class="status-pill">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusLabel">Camera Off</span>
            </div>
            <div class="status-pill" id="fpsBadge">0 FPS</div>
        </div>
    </div>

    <div class="controls-bar">
        <button id="startBtn">Start Camera & Audio</button>
    </div>

    <div class="result-card">
        <div class="label-small" id="activeLabelTitle">Active Audio Translation (40 Gestures)</div>
        <div id="translationText">Ready</div>
        <div class="hold-bar-bg">
            <div id="holdBarFill"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const translationText = document.getElementById('translationText');
        const holdBarFill = document.getElementById('holdBarFill');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const fpsBadge = document.getElementById('fpsBadge');
        const langBadge = document.getElementById('langBadge');

        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('isl_lang') || 'en';
        langBadge.innerText = ` ${currentLang.toUpperCase()} • 40 Signs`;

        let isRunning = false;
        let currentCandidate = "";
        let candidateStartTime = 0;
        const REQUIRED_HOLD_MS = 890; // 0.89s precision
        let lastSpoken = "";
        let lastFrameTime = performance.now();

        // Multilingual dictionary for all 40 gestures
        const dictionary = {
            en: {
                "Hello": "Hello",
                "Namaste": "Namaste",
                "I Love You": "I Love You",
                "Help Me": "Help Me",
                "Yes, Good": "Yes, Good",
                "Thank You": "Thank You",
                "One": "One",
                "Two": "Two",
                "Three": "Three",
                "Four": "Four",
                "Six": "Six",
                "Seven": "Seven",
                "Eight": "Eight",
                "Nine / OK": "Nine / OK",
                "Zero": "Zero",
                "No, Bad": "No, Bad",
                "Call Me": "Call Me",
                "Unity": "Unity",
                "Water": "Water",
                "Food": "Food",
                "Stop": "Stop",
                "Please": "Please",
                "Sorry": "Sorry",
                "Friend": "Friend",
                "Family": "Family",
                "Home": "Home",
                "School": "School",
                "Teacher": "Teacher",
                "Doctor / Emergency": "Doctor / Emergency",
                "Pain / Hurt": "Pain / Hurt",
                "Happy": "Happy",
                "Sad": "Sad",
                "Good Morning": "Good Morning",
                "Good Night": "Good Night",
                "Welcome": "Welcome",
                "Come Here": "Come Here",
                "Go": "Go",
                "Wait": "Wait",
                "Correct": "Correct",
                "Victory": "Victory",
                welcome: "Welcome to our page, ISL to audio translator. This page is designed for speech impaired peoples."
            },
            hi: {
                "Hello": "नमस्ते (Hello)",
                "Namaste": "नमस्ते",
                "I Love You": "मैं तुमसे प्यार करता हूँ",
                "Help Me": "मेरी मदद करो",
                "Yes, Good": "हाँ, अच्छा",
                "Thank You": "धन्यवाद",
                "One": "एक",
                "Two": "दो",
                "Three": "तीन",
                "Four": "चार",
                "Six": "छह",
                "Seven": "सात",
                "Eight": "आठ",
                "Nine / OK": "नौ / ठीक है",
                "Zero": "शून्य",
                "No, Bad": "नहीं, बुरा",
                "Call Me": "मुझे कॉल करें",
                "Unity": "एकता",
                "Water": "पानी",
                "Food": "खाना",
                "Stop": "रुको",
                "Please": "कृपया",
                "Sorry": "माफ़ करें",
                "Friend": "दोस्त",
                "Family": "परिवार",
                "Home": "घर",
                "School": "स्कूल",
                "Teacher": "शिक्षक",
                "Doctor / Emergency": "डॉक्टर / आपातकाल",
                "Pain / Hurt": "दर्द हो रहा है",
                "Happy": "खुश",
                "Sad": "उदास",
                "Good Morning": "सुप्रभात",
                "Good Night": "शुभ रात्रि",
                "Welcome": "स्वागत है",
                "Come Here": "यहाँ आओ",
                "Go": "जाओ",
                "Wait": "इंतज़ार करें",
                "Correct": "सही",
                "Victory": "जीत",
                welcome: "हमारे पेज पर आपका स्वागत है। यह पेज वाक्-बाधित लोगों की सहायता के लिए बनाया गया है।"
            },
            pa: {
                "Hello": "ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ",
                "Namaste": "ਨਮਸਤੇ",
                "I Love You": "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ",
                "Help Me": "ਮੇਰੀ ਮਦਦ ਕਰੋ",
                "Yes, Good": "ਹਾਂ, ਠੀਕ ਹੈ",
                "Thank You": "ਧੰਨਵਾਦ",
                "One": "ਇੱਕ",
                "Two": "ਦੋ",
                "Three": "ਤਿੰਨ",
                "Four": "ਚਾਰ",
                "Six": "ਛੇ",
                "Seven": "ਸੱਤ",
                "Eight": "ਅੱਠ",
                "Nine / OK": "ਨੌਂ / ਠੀਕ ਹੈ",
                "Zero": "ਸਿਫ਼ਰ",
                "No, Bad": "ਨਹੀਂ, ਮਾੜਾ",
                "Call Me": "ਮੈਨੂੰ ਕਾਲ ਕਰੋ",
                "Unity": "ਏਕਤਾ",
                "Water": "ਪਾਣੀ",
                "Food": "ਖਾਣਾ",
                "Stop": "ਰੁਕੋ",
                "Please": "ਕਿਰਪਾ ਕਰਕੇ",
                "Sorry": "ਮਾਫ਼ ਕਰਨਾ",
                "Friend": "ਦੋਸਤ",
                "Family": "ਪਰਿਵਾਰ",
                "Home": "ਘਰ",
                "School": "ਸਕੂਲ",
                "Teacher": "ਅਧਿਆਪਕ",
                "Doctor / Emergency": "ਡਾਕਟਰ / ਐਮਰਜੈਂਸੀ",
                "Pain / Hurt": "ਦਰਦ ਹੋ ਰਿਹਾ ਹੈ",
                "Happy": "ਖੁਸ਼",
                "Sad": "ਉਦਾਸ",
                "Good Morning": "ਸ਼ੁਭ ਸਵੇਰ",
                "Good Night": "ਸ਼ੁਭ ਰਾਤ",
                "Welcome": "ਜੀ ਆਇਆਂ ਨੂੰ",
                "Come Here": "ਇੱਥੇ ਆਓ",
                "Go": "ਜਾਓ",
                "Wait": "ਉਡੀਕ ਕਰੋ",
                "Correct": "ਸਹੀ",
                "Victory": "ਜਿੱਤ",
                welcome: "ਸਾਡੇ ਪੇਜ ਤੇ ਜੀ ਆਇਆਂ ਨੂੰ। ਇਹ ਪੇਜ ਬੋਲਣ ਤੋਂ ਅਸਮਰੱਥ ਲੋਕਾਂ ਦੀ ਸਹਾਇਤਾ ਲਈ ਤਿਆਰ ਕੀਤਾ ਗਿਆ ਹੈ।"
            }
        };

        function getSpeechLangCode(lang) {
            if (lang === 'hi') return 'hi-IN';
            if (lang === 'pa') return 'pa-IN';
            return 'en-IN';
        }

        function speak(textKey) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const localizedText = dictionary[currentLang][textKey] || textKey;
            const msg = new SpeechSynthesisUtterance(localizedText);
            msg.lang = getSpeechLangCode(currentLang);
            msg.rate = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Google') || v.lang.includes(currentLang));
            if (femaleVoice) msg.voice = femaleVoice;

            window.speechSynthesis.speak(msg);
        }

        function dist3D(p1, p2) {
            return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z - p2.z) * 1.5);
        }

        function analyzeHand3D(lm) {
            const wrist = lm[0];
            const middleMcp = lm[9];
            const pinkyMcp = lm[17];

            const isSeedha = wrist.y > middleMcp.y + 0.03;
            const isDown = wrist.y < middleMcp.y - 0.03;
            const isSideways = Math.abs(wrist.x - middleMcp.x) > Math.abs(wrist.y - middleMcp.y) * 1.2;

            const tipToWrist = (p) => dist3D(p, wrist);
            const mcpToWrist = (p) => dist3D(p, wrist);

            const thumbOpen = dist3D(lm[4], pinkyMcp) > dist3D(lm[3], pinkyMcp) * 1.1;
            const indexOpen = tipToWrist(lm[8]) > mcpToWrist(lm[6]) * 1.15;
            const middleOpen = tipToWrist(lm[12]) > mcpToWrist(lm[10]) * 1.15;
            const ringOpen = tipToWrist(lm[16]) > mcpToWrist(lm[14]) * 1.15;
            const pinkyOpen = tipToWrist(lm[20]) > mcpToWrist(lm[18]) * 1.15;

            const thumbIndexDist = dist3D(lm[4], lm[8]);
            const allTipsClustered = dist3D(lm[4], lm[8]) < 0.09 && dist3D(lm[8], lm[12]) < 0.09 && dist3D(lm[12], lm[16]) < 0.09;

            return {
                isSeedha, isDown, isSideways,
                thumbOpen, indexOpen, middleOpen, ringOpen, pinkyOpen,
                thumbIndexDist, allTipsClustered,
                wrist, middleMcp, thumbTip: lm[4], indexTip: lm[8], middleTip: lm[12], ringTip: lm[16], pinkyTip: lm[20]
            };
        }

        function classifyGesture(handsList) {
            if (handsList.length === 0) return "";

            // --- TWO-HAND GESTURES (14 signs) ---
            if (handsList.length === 2) {
                const h1 = handsList[0], h2 = handsList[1];
                const wristDist = dist3D(h1.wrist, h2.wrist);
                const indexTipDist = dist3D(h1.indexTip, h2.indexTip);
                const middleTipDist = dist3D(h1.middleTip, h2.middleTip);

                const h1Fist = !h1.thumbOpen && !h1.indexOpen && !h1.middleOpen && !h1.ringOpen && !h1.pinkyOpen;
                const h2Fist = !h2.thumbOpen && !h2.indexOpen && !h2.middleOpen && !h2.ringOpen && !h2.pinkyOpen;
                const h1AllOpen = h1.thumbOpen && h1.indexOpen && h1.middleOpen && h1.ringOpen && h1.pinkyOpen;
                const h2AllOpen = h2.thumbOpen && h2.indexOpen && h2.middleOpen && h2.ringOpen && h2.pinkyOpen;
                const h1V = h1.indexOpen && h1.middleOpen && !h1.ringOpen && !h1.pinkyOpen;
                const h2V = h2.indexOpen && h2.middleOpen && !h2.ringOpen && !h2.pinkyOpen;
                const h1Point = h1.indexOpen && !h1.middleOpen && !h1.ringOpen && !h1.pinkyOpen;
                const h2Point = h2.indexOpen && !h2.middleOpen && !h2.ringOpen && !h2.pinkyOpen;

                // Existing 2-hand gestures
                if (wristDist < 0.55 && indexTipDist < 0.35 && h1.isSeedha && h2.isSeedha) return "Namaste";
                if (indexTipDist < 0.18 && wristDist > 0.12 && !h1AllOpen) return "I Love You";

                // New 2-hand gestures
                if (h1V && h2V && h1.isSeedha && h2.isSeedha) return "Victory";
                if (h1Fist && h2Fist && wristDist < 0.35) return "Doctor / Emergency";
                if (h1Point && h2Point && indexTipDist < 0.14 && wristDist > 0.20) return "Pain / Hurt";
                if (h1Point && h2Point && wristDist < 0.25) return "Friend";
                if (h1AllOpen && h2AllOpen && h1.wrist.y < 0.45 && h2.wrist.y < 0.45) return "Happy";
                if (h1AllOpen && h2AllOpen && wristDist > 0.55) return "Family";
                if (h1AllOpen && h2AllOpen && indexTipDist < 0.16 && wristDist > 0.30) return "Home";
                if (h1AllOpen && h2AllOpen && h1.isSideways && h2.isSideways) return "School";
                if (h1AllOpen && h2AllOpen && Math.abs(h1.wrist.y - h2.wrist.y) > 0.18) return "Good Morning";
                if (h1AllOpen && h2AllOpen && h1.isDown && h2.isDown) return "Good Night";
                if (h1AllOpen && h2AllOpen && wristDist >= 0.35 && wristDist <= 0.55) return "Welcome";
            }

            // --- SINGLE-HAND GESTURES (26 signs) ---
            const h = handsList[0];
            const t = h.thumbOpen, i = h.indexOpen, m = h.middleOpen, r = h.ringOpen, p = h.pinkyOpen;

            // Existing single-hand gestures
            if (h.isSeedha && t && i && m && r && p && !h.isSideways) return "Hello";
            if (!t && !i && !m && !r && !p) {
                if (h.wrist.y < 0.55) return "Sorry";
                return "Help Me";
            }
            if (t && !i && !m && !r && !p) {
                if (h.thumbTip.y < h.wrist.y - 0.05) return "Yes, Good";
                if (h.thumbTip.y > h.wrist.y + 0.05) return "No, Bad";
                return "Water";
            }
            if (h.isSeedha && !t && i && m && !r && !p && !h.isSideways) return "Thank You";
            if (!t && i && !m && !r && !p) {
                if (h.isSideways) return "Go";
                if (h.indexTip.y > h.middleMcp.y) return "Come Here";
                if (h.wrist.y < 0.45) return "Teacher";
                return "One";
            }
            if (t && i && m && !r && !p) return "Two";

            // New single-hand gestures
            if (h.allTipsClustered) return "Food";
            if (h.thumbIndexDist < 0.065 && !m && !r && !p) return "Zero";
            if (h.thumbIndexDist < 0.065 && m && r && p) return "Nine / OK";
            if (!t && i && m && r && p && !h.isSideways) return "Four";
            if (!t && i && m && r && !p) return "Six";
            if (!t && i && m && !r && p) return "Seven";
            if (!t && i && !m && r && p) return "Eight";
            if (t && i && m && r && !p) return "Three";
            if (t && !i && !m && !r && p) return "Call Me";
            if (!t && i && !m && !r && p) return "Unity";
            if (t && i && !m && !r && !p) return "Correct";
            if (h.isSideways && t && i && m && r && p) return "Stop";
            if (h.isDown && t && i && m && r && p) return "Sad";
            if (t && i && m && r && p && h.wrist.y > 0.65) return "Please";
            if (t && i && m && r && p) return "Wait";

            return "";
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

        hands.onResults((results) => {
            const now = performance.now();
            const fps = Math.round(1000 / Math.max(1, now - lastFrameTime));
            lastFrameTime = now;
            fpsBadge.innerText = `${fps} FPS`;

            if (video.videoWidth && canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Mirror video and skeleton naturally
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            const analyzedHands = [];
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((lm, idx) => {
                    const lineColor = idx === 0 ? '#0a84ff' : '#af52de';
                    drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: lineColor, lineWidth: 3 });
                    analyzedHands.push(analyzeHand3D(lm));
                });
            }
            ctx.restore(); // Restore context so text labels render completely unmirrored!

            const detectedSign = classifyGesture(analyzedHands);
            const currentTime = performance.now();

            // Render crystal-clear, unmirrored floating label right above hand
            if (detectedSign && results.multiHandLandmarks && results.multiHandLandmarks[0]) {
                const handLm = results.multiHandLandmarks[0];
                const wristX = (1 - handLm[0].x) * canvas.width;
                const wristY = handLm[0].y * canvas.height;
                const displayText = dictionary[currentLang][detectedSign] || detectedSign;

                ctx.save();
                ctx.font = 'bold 16px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                const textWidth = ctx.measureText(displayText).width;
                ctx.fillStyle = 'rgba(22, 22, 25, 0.9)';
                ctx.beginPath();
                ctx.roundRect(wristX - textWidth / 2 - 12, wristY - 55, textWidth + 24, 32, 8);
                ctx.fill();
                ctx.strokeStyle = '#0a84ff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#0a84ff';
                ctx.fillText(displayText, wristX, wristY - 33);
                ctx.restore();
            }

            if (detectedSign) {
                if (detectedSign === currentCandidate) {
                    const elapsed = currentTime - candidateStartTime;
                    const pct = Math.min(100, Math.round((elapsed / REQUIRED_HOLD_MS) * 100));
                    holdBarFill.style.width = pct + "%";

                    if (elapsed >= REQUIRED_HOLD_MS) {
                        translationText.innerText = dictionary[currentLang][detectedSign] || detectedSign;
                        if (lastSpoken !== detectedSign) {
                            speak(detectedSign);
                            lastSpoken = detectedSign;
                        }
                    }
                } else {
                    currentCandidate = detectedSign;
                    candidateStartTime = currentTime;
                    holdBarFill.style.width = "0%";
                }
            } else {
                currentCandidate = "";
                candidateStartTime = 0;
                holdBarFill.style.width = "0%";
            }
        });

        async function processLoop() {
            if (!isRunning) return;
            if (video.readyState >= 2) await hands.send({ image: video });
            requestAnimationFrame(processLoop);
        }

        startBtn.addEventListener('click', async () => {
            if (isRunning) return;
            
            const welcomeMsg = dictionary[currentLang].welcome || dictionary['en'].welcome;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(welcomeMsg);
                msg.lang = getSpeechLangCode(currentLang);
                window.speechSynthesis.speak(msg);
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                isRunning = true;
                statusDot.classList.add('live');
                statusLabel.innerText = "Live AI (40)";
                startBtn.innerText = "Translator Running...";
                startBtn.style.opacity = "0.7";
                processLoop();
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        });
    </script>
</body>
</html>
