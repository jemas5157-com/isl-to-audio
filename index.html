<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ISL Voice AI" />
    <title>ISL Voice AI — Sign Language Translator</title>

    <!-- MediaPipe Hands + Drawing Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #070b14;
            --card: rgba(17, 25, 40, 0.85);
            --border: rgba(56, 189, 248, 0.22);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --green: #22c55e;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at top, #0f1c36 0%, var(--bg) 65%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 14px 32px;
        }

        header {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.6; }
        }

        h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--border);
            color: var(--accent);
        }

        .camera-card {
            position: relative;
            width: 100%;
            max-width: 430px;
            aspect-ratio: 3/4;
            background: #0b1120;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.1);
        }

        video, canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .status-pill {
            background: rgba(7, 11, 20, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .status-dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .controls-bar {
            width: 100%;
            max-width: 430px;
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        button, select {
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 16px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:active { transform: scale(0.97); }

        #startBtn {
            flex: 2;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #04101d;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        #muteBtn {
            flex: 1;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .result-card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-top: 14px;
            text-align: center;
        }

        .label-small {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        #translationText {
            font-size: 30px;
            font-weight: 800;
            color: var(--accent);
            min-height: 38px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .hold-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            margin-top: 12px;
            overflow: hidden;
        }

        #holdBarFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            transition: width 0.08s linear;
        }

        .guide-card {
            width: 100%;
            max-width: 430px;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 16px;
            margin-top: 14px;
        }

        .guide-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .gesture-item {
            background: rgba(255,255,255,0.04);
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gesture-item span:first-child { color: var(--muted); }
        .gesture-item span:last-child { font-weight: 700; color: var(--text); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-dot"></div>
            <h1>ISL Voice AI</h1>
        </div>
        <div class="badge">LIVE EDGE AI</div>
    </header>

    <div class="camera-card">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div class="hud-overlay">
            <div class="status-pill">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusLabel">Camera Off</span>
            </div>
            <div class="status-pill" id="fpsBadge">0 FPS</div>
        </div>
    </div>

    <div class="controls-bar">
        <button id="startBtn">Start Camera</button>
        <button id="muteBtn">🔊 Voice On</button>
    </div>

    <div class="result-card">
        <div class="label-small">Detected Indian Sign Language</div>
        <div id="translationText">Ready</div>
        <div class="hold-bar-bg">
            <div id="holdBarFill"></div>
        </div>
    </div>

    <div class="guide-card">
        <div class="label-small">Supported Gestures (Hold 0.6s to Speak)</div>
        <div class="guide-grid">
            <div class="gesture-item"><span>✋ Open Palm</span><span>Hello</span></div>
            <div class="gesture-item"><span>✊ Closed Fist</span><span>Help Me</span></div>
            <div class="gesture-item"><span>👍 Thumb Up</span><span>Yes / Good</span></div>
            <div class="gesture-item"><span>☝️ Index Up</span><span>One / Wait</span></div>
            <div class="gesture-item"><span>✌️ V-Sign</span><span>Thank You</span></div>
            <div class="gesture-item"><span>🤟 ILY Sign</span><span>I Love You</span></div>
            <div class="gesture-item"><span>🤙 Shaka</span><span>Call Me</span></div>
            <div class="gesture-item"><span>🖖 Four Fingers</span><span>Water / Please</span></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');
        const translationText = document.getElementById('translationText');
        const holdBarFill = document.getElementById('holdBarFill');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const fpsBadge = document.getElementById('fpsBadge');

        let isRunning = false;
        let isMuted = false;
        let currentCandidate = "";
        let holdFrames = 0;
        const REQUIRED_FRAMES = 10; // ~0.6s steady hold to prevent false triggers
        let lastSpoken = "";
        let lastFrameTime = performance.now();

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteBtn.innerText = isMuted ? "🔇 Muted" : "🔊 Voice On";
            if (isMuted) window.speechSynthesis.cancel();
        });

        function speak(text) {
            if (isMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-IN';
            msg.rate = 0.98;
            window.speechSynthesis.speak(msg);
        }

        function detectGesture(lm) {
            // Finger states (true = extended)
            const thumbOut = Math.abs(lm[4].x - lm[2].x) > 0.06 && lm[4].y < lm[3].y + 0.04;
            const indexUp = lm[8].y < lm[6].y;
            const middleUp = lm[12].y < lm[10].y;
            const ringUp = lm[16].y < lm[14].y;
            const pinkyUp = lm[20].y < lm[18].y;

            if (indexUp && middleUp && ringUp && pinkyUp && thumbOut) return "Hello";
            if (indexUp && middleUp && ringUp && pinkyUp && !thumbOut) return "Water Please";
            if (!indexUp && !middleUp && !ringUp && !pinkyUp && !thumbOut) return "Help Me";
            if (thumbOut && !indexUp && !middleUp && !ringUp && !pinkyUp) return "Yes, Good";
            if (indexUp && !middleUp && !ringUp && !pinkyUp && !thumbOut) return "Please Wait";
            if (indexUp && middleUp && !ringUp && !pinkyUp) return "Thank You";
            if (thumbOut && indexUp && !middleUp && !ringUp && pinkyUp) return "I Love You";
            if (thumbOut && !indexUp && !middleUp && !ringUp && pinkyUp) return "Call Me";

            return "";
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            const now = performance.now();
            const fps = Math.round(1000 / Math.max(1, now - lastFrameTime));
            lastFrameTime = now;
            fpsBadge.innerText = `${fps} FPS`;

            if (video.videoWidth && canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
                drawLandmarks(ctx, lm, { color: '#22c55e', lineWidth: 1, radius: 4 });

                const sign = detectGesture(lm);
                if (sign) {
                    if (sign === currentCandidate) {
                        holdFrames++;
                    } else {
                        currentCandidate = sign;
                        holdFrames = 1;
                    }

                    const pct = Math.min(100, Math.round((holdFrames / REQUIRED_FRAMES) * 100));
                    holdBarFill.style.width = pct + "%";

                    if (holdFrames >= REQUIRED_FRAMES) {
                        translationText.innerText = sign;
                        if (lastSpoken !== sign) {
                            speak(sign);
                            lastSpoken = sign;
                        }
                    }
                } else {
                    holdFrames = 0;
                    holdBarFill.style.width = "0%";
                }
            } else {
                currentCandidate = "";
                holdFrames = 0;
                lastSpoken = "";
                holdBarFill.style.width = "0%";
                translationText.innerText = "Show Hand";
            }
            ctx.restore();
        });

        async function processLoop() {
            if (!isRunning) return;
            if (video.readyState >= 2) {
                await hands.send({ image: video });
            }
            requestAnimationFrame(processLoop);
        }

        startBtn.addEventListener('click', async () => {
            if (isRunning) return;
            // Unlock iOS Safari audio engine on direct user tap
            speak("System ready");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                isRunning = true;
                statusDot.classList.add('live');
                statusLabel.innerText = "AI Tracking Live";
                startBtn.innerText = "Running...";
                startBtn.style.opacity = "0.7";
                processLoop();
            } catch (err) {
                alert("Please allow camera access in Safari Settings: " + err.message);
            }
        });
    </script>
</body>
</html>
