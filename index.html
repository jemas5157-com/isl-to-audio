<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ISL to Audio Translator</title>
    
    <!-- MediaPipe Hand Tracking Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 16px; }
        h1 { font-size: 20px; margin: 12px 0; text-align: center; }
        .camera-box { position: relative; width: 100%; max-width: 400px; aspect-ratio: 3/4; background: #1e293b; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        video, canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .output-box { margin-top: 16px; width: 100%; max-width: 400px; background: #1e293b; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        #translationText { font-size: 22px; font-weight: bold; color: #38bdf8; margin-bottom: 6px; }
        #gestureSub { font-size: 14px; color: #94a3b8; }
        button { margin-top: 14px; width: 100%; max-width: 400px; background: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; }
        button:active { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>ISL to Audio Translator</h1>
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <div class="output-box">
        <div id="translationText">Tap Start Camera</div>
        <div id="gestureSub">Awaiting hand gestures...</div>
    </div>
    <button id="startBtn">Start Camera</button>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const translationText = document.getElementById('translationText');
        const gestureSub = document.getElementById('gestureSub');

        let lastSpoken = "";

        function speakText(text) {
            if ('speechSynthesis' in window && text !== lastSpoken) {
                window.speechSynthesis.cancel(); // Stop previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
                lastSpoken = text;
            }
        }

        // Simple heuristic gesture classifier based on finger landmarks
        function classifyGesture(landmarks) {
            // Thumb, Index, Middle, Ring, Pinky tip and pip/mcp joints
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexMcp = landmarks[5];
            const middleTip = landmarks[12];
            const middleMcp = landmarks[9];
            const ringTip = landmarks[16];
            const ringMcp = landmarks[13];
            const pinkyTip = landmarks[20];
            const pinkyMcp = landmarks[17];

            // Check if fingers are extended (tip higher than joint in y-axis)
            const indexOpen = indexTip.y < indexMcp.y;
            const middleOpen = middleTip.y < middleMcp.y;
            const ringOpen = ringTip.y < ringMcp.y;
            const pinkyOpen = pinkyTip.y < pinkyMcp.y;

            // Open Palm -> "Hello"
            if (indexOpen && middleOpen && ringOpen && pinkyOpen) {
                return "Hello";
            }
            // Fist -> "Help"
            else if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
                return "Help";
            }
            // Thumbs Up / Index pointing up -> "Yes" or "Good"
            else if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
                return "Good / Yes";
            }
            // Index and Middle open (V sign) -> "Thank You"
            else if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
                return "Thank You";
            }

            return "Searching Sign...";
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#38bdf8', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#f43f5e', lineWidth: 1, radius: 4});

                    let detectedSign = classifyGesture(landmarks);
                    translationText.innerText = detectedSign;
                    if (detectedSign !== "Searching Sign...") {
                        gestureSub.innerText = "Gesture Recognized";
                        speakText(detectedSign);
                    } else {
                        gestureSub.innerText = "Hold sign steady";
                    }
                }
            } else {
                translationText.innerText = "Show Hand to Camera";
                gestureSub.innerText = "No hand detected";
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        startBtn.addEventListener('click', async () => {
            try {
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();
                startBtn.style.display = 'none';
                translationText.innerText = "Camera Active";
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        });
    </script>
</body>
</html>
